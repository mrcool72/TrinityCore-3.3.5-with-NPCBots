name: TrinityCore Windows x64 Build

on:
  push:
    branches:
      - "autonomous-ai"
      - "npcbots_3.3.5"
  pull_request:
    branches:
      - "autonomous-ai"
      - "npcbots_3.3.5"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build `
            --config Release `
            --parallel 4
