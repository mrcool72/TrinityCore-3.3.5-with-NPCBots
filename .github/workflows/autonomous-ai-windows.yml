name: TrinityCore Windows x64 Build

on:
  push:
    branches:
      - "autonomous-ai"
      - "npcbots_3.3.5"
  pull_request:
    branches:
      - "autonomous-ai"
      - "npcbots_3.3.5"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Boost 1.78
        shell: pwsh
        run: |
          choco install boost-msvc-14.3 --version=1.78.0 -y --no-progress

      - name: Configure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Set-Location build

          cmake .. `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DBOOST_ROOT="C:\local\boost_1_78_0"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build `
            --config Release `
            --parallel 2

      - name: Build Debug
        shell: pwsh
        run: |
          cmake --build build `
            --config Debug `
            --parallel 2
