name: TrinityCore Windows x64 Build

on:
  push:
    branches:
      - "autonomous-ai"
      - "npcbots_3.3.5"
  pull_request:
    branches:
      - "autonomous-ai"
      - "npcbots_3.3.5"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Boost
        uses: MarkusJx/install-boost@v2
        id: install-boost
        with:
          boost_version: 1.84.0
          link: static
          platform_version: 2022
          toolset: msvc

      - name: Configure
        shell: pwsh
        env:
          BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_CXX_STANDARD=20 `
            -DCMAKE_CXX_STANDARD_REQUIRED=ON `
            -DCMAKE_CXX_EXTENSIONS=OFF `
            -DCMAKE_CXX_FLAGS="/std:c++20 /Zc:__cplusplus /EHsc"

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build `
            --config Release `
            --parallel 4
