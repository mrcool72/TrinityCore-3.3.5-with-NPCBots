name: TrinityCore Windows x64 Build

on:
  push:
    branches:
      - "autonomous-ai"
  pull_request:
    branches:
      - "autonomous-ai"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DWITH_WARNINGS=0

      - name: Build
        run: |
          cmake --build build `
            --config Release `
            --parallel
