name: Windows x64

on:
  push:
    branches:
      - 'npcbots_3.3.5'
      - 'autonomous-ai'
  pull_request:
    branches:
      - 'npcbots_3.3.5'
      - 'autonomous-ai'
  workflow_dispatch:

concurrency:
  group: ${{ github.head_ref || github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      CMAKE_BUILD_TYPE: RelWithDebInfo
      MYSQL_ROOT_DIR: C:/tools/mysql/current
      OPENSSL_ROOT_DIR: C:/libs/openssl
    steps:
      - uses: actions/checkout@v5

      - name: Install MySQL 8.4.6 development files
        shell: pwsh
        run: |
          choco install mysql --version=8.4.6 -y --no-progress --params="/installLocation:C:\tools /port:3307 /serviceName:TrinityBuildMySQL"
          if (!(Test-Path "$env:MYSQL_ROOT_DIR\include\mysql.h")) { throw "MySQL headers were not found at $env:MYSQL_ROOT_DIR" }
          if (!(Test-Path "$env:MYSQL_ROOT_DIR\lib\libmysql.lib")) { throw "MySQL library was not found at $env:MYSQL_ROOT_DIR" }
          if (!(Test-Path "$env:MYSQL_ROOT_DIR\bin\libmysql.dll")) { throw "MySQL DLL was not found at $env:MYSQL_ROOT_DIR" }

      - name: Cache OpenSSL 3.6.2
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: ${{ env.OPENSSL_ROOT_DIR }}
          key: openssl-3.6.2-win64

      - name: Install OpenSSL 3.6.2
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://slproweb.com/download/Win64OpenSSL-3_6_2.exe"
          $installer = "$env:TEMP\openssl-3.6.2.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $expected = "bdeaf4e8e7dc50d48cb340b180cb279354a05b3f8448136e6d6cc2ae17477515299b9d4bc4a16e41edf2a786f25c7cae039067b39094095117285565d0040dfb"
          $actual = (Get-FileHash $installer -Algorithm SHA512).Hash.ToLower()
          if ($actual -ne $expected) { throw "OpenSSL checksum mismatch." }
          New-Item -ItemType Directory -Force -Path $env:OPENSSL_ROOT_DIR | Out-Null
          Start-Process -Wait -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/DIR=$env:OPENSSL_ROOT_DIR"
          & "$env:OPENSSL_ROOT_DIR\bin\openssl.exe" version

      - name: Install Boost 1.84.0 for MSVC 14.3
        id: install-boost
        uses: MarkusJx/install-boost@v2
        with:
          boost_version: 1.84.0
          link: static
          platform_version: 2022
          toolset: msvc

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Configure CMake
        shell: pwsh
        env:
          BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}
        run: |
          cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}\build" -G "Visual Studio 17 2022" -A x64 -DBOOST_ROOT="$env:BOOST_ROOT" -DMYSQL_ROOT_DIR="$env:MYSQL_ROOT_DIR" -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR" -DWITH_WARNINGS_AS_ERRORS=ON -DTOOLS=ON -DBUILD_TESTING=OFF

      - name: Build
        shell: pwsh
        run: |
          cmake --build "${{ github.workspace }}\build" --config "${{ env.CMAKE_BUILD_TYPE }}" --parallel

      - name: Verify binaries
        shell: pwsh
        run: |
          $bin = "${{ github.workspace }}\build\bin\${{ env.CMAKE_BUILD_TYPE }}"
          if (!(Test-Path "$bin\worldserver.exe")) { throw "worldserver.exe was not produced." }
          if (!(Test-Path "$bin\authserver.exe")) { throw "authserver.exe was not produced." }
          & "$bin\worldserver.exe" --version
          & "$bin\authserver.exe" --version

      - name: Copy runtime dependencies
        shell: pwsh
        run: |
          $bin = "${{ github.workspace }}\build\bin\${{ env.CMAKE_BUILD_TYPE }}"
          Copy-Item "$env:MYSQL_ROOT_DIR\bin\libmysql.dll" "$bin\libmysql.dll" -Force
          Copy-Item "$env:OPENSSL_ROOT_DIR\bin\libcrypto-3-x64.dll" "$bin\" -Force
          Copy-Item "$env:OPENSSL_ROOT_DIR\bin\libssl-3-x64.dll" "$bin\" -Force
