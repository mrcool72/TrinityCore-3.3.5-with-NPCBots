name: Windows x64 Build

on:
  push:
    branches: [ "autonomous-ai" ]
  pull_request:
    branches: [ "autonomous-ai" ]
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat"
          & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" install boost-filesystem boost-program-options boost-regex boost-locale openssl libmariadb:x64-windows-static --triplet x64-windows-static

      - name: Configure CMake
        shell: pwsh
        run: |
          $vcpkg = "$env:RUNNER_TEMP\vcpkg"
          $toolchain = "$vcpkg\scripts\buildsystems\vcpkg.cmake"
          $install = "$vcpkg\installed\x64-windows-static"
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$toolchain" "-DBOOST_ROOT=$install" "-DMYSQL_ROOT_DIR=$install" -DWITH_WARNINGS=0 -DWITH_WARNINGS_AS_ERRORS=0 -DBUILD_TESTING=OFF -DTOOLS=1 -DSERVERS=1

      - name: Build
        shell: pwsh
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Verify binaries
        shell: pwsh
        run: |
          $required = @("build\src\server\worldserver\RelWithDebInfo\worldserver.exe", "build\src\server\authserver\RelWithDebInfo\authserver.exe")
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Required build artifact was not produced: $file" }
          }
          Write-Host "Windows x64 build completed successfully."