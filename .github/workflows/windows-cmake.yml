name: Windows x64 CMake CI

on:
  push:
    branches: [ "autonomous-ai" ]
  pull_request:
    branches: [ "autonomous-ai" ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DBUILD_TESTING=ON

      - name: Build RelWithDebInfo x64
        run: >
          cmake --build build
          --config RelWithDebInfo
          --parallel 2

      - name: Run tests
        run: >
          ctest
          --test-dir build
          -C RelWithDebInfo
          --output-on-failure
